name: Deploy Otomatis ke Server Panda

on:
  push:
    branches:
      - main  # Robot akan bekerja setiap ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Masuk ke folder project
            cd /var/www/Web-PANDA

            # 1. Tarik kodingan terbaru
            git pull origin main

            # 2. Update database (jika ada perubahan struktur tabel)
            php artisan migrate --force

            # 3. Bersihkan cache agar perubahan config/route terbaca
            php artisan optimize:clear

            # 4. (Opsional) Kunci kembali config biar ngebut
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
